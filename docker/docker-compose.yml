services:
  qwen2api:
    container_name: qwen2api
    image: rfym21/qwen2api:latest
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src:ro
      - ./public/captcha.html:/app/public/captcha.html:ro
    env_file:
      - .env
    healthcheck:
      # Dashboard root returns 200 without auth; wget ships in the image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Dedicated, isolated linuxserver-chromium for the HTML-captcha (Aliyun FeiLin)
  # solver. Same working X-input setup as the noVNC chrome (its own Xvfb :1 + openbox),
  # real RTX 3090 GPU (genuine NVIDIA webgl fingerprint vs llvmpipe), separate profile.
  # Does NOT touch the user's noVNC browser. CDP exposed via socat (9562→127.0.0.1:9561).
  chrome-solver:
    container_name: qwen2api-chrome-solver
    image: lscr.io/linuxserver/chromium:latest
    runtime: nvidia
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - SELKIES_ENCODER=jpeg
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CHROME_CLI=/config/.config/chromium --start-maximized --remote-debugging-port=9561 --proxy-server=http://192.168.0.61:8888 about:blank
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "109"
    volumes:
      - ./chrome-solver-config:/config
    ports:
      - "127.0.0.1:9563:9563"   # CDP bridge (socat) — host reaches the solver's chromium
      - "192.168.0.58:3012:3000"   # noVNC (http)  — manual view of the .61 logged-in session
      - "192.168.0.58:3013:3001"   # noVNC (https)
    shm_size: "1gb"
    restart: unless-stopped

  # "Chrome runtime" — long-running container that provides chromium binary on demand.
  # Daemon spawns short-lived chromium processes via `docker exec` per bypass, each
  # with its own --user-data-dir, --proxy-server and --remote-debugging-port. This
  # avoids the Target.createBrowserContext("Not allowed") security policy that
  # current Chrome versions enforce on TCP CDP connections.
  chrome-headless:
    container_name: qwen2api-chrome-headless
    image: zenika/alpine-chrome:latest
    entrypoint: ["/bin/sh"]
    command: ["-c", "while true; do sleep 3600; done"]
    volumes:
      - ./chrome-headless-data:/data
    shm_size: "1gb"
    # Host networking — per-bypass debug ports bind on container's loopback,
    # daemon (also on host) reaches them via 127.0.0.1.
    network_mode: host
    restart: unless-stopped
