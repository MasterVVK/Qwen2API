services:
  qwen2api:
    container_name: qwen2api
    image: rfym21/qwen2api:latest
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src:ro
      - ./public/captcha.html:/app/public/captcha.html:ro
    env_file:
      - .env
    healthcheck:
      # Dashboard root returns 200 without auth; wget ships in the image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  chrome:
    container_name: qwen2api-chrome
    image: lscr.io/linuxserver/chromium:latest
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
      - SELKIES_ENCODER=jpeg
      - DRINODE=/dev/dri/renderD128
      # No default proxy: each per-account BrowserContext (via CDP) sets its own proxyServer
      # according to account.proxy. Accounts without proxy go through the container's host IP.
      # --remote-debugging-port: enable CDP for the bypass daemon
      # noVNC chromium runs in WINDOWED mode (for manual UI) — does NOT support
      # Target.createBrowserContext in non-headless 148+. Bypass is delegated to
      # a separate headless container (chrome-headless service below).
      - CHROME_CLI=/config/.config/chromium --start-maximized about:blank
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "109"
    volumes:
      - ./chrome-config:/config
    ports:
      - "192.168.0.58:3010:3000"
      - "192.168.0.58:3011:3001"
    shm_size: "1gb"
    restart: unless-stopped

  # "Chrome runtime" — long-running container that provides chromium binary on demand.
  # Daemon spawns short-lived chromium processes via `docker exec` per bypass, each
  # with its own --user-data-dir, --proxy-server and --remote-debugging-port. This
  # avoids the Target.createBrowserContext("Not allowed") security policy that
  # current Chrome versions enforce on TCP CDP connections.
  chrome-headless:
    container_name: qwen2api-chrome-headless
    image: zenika/alpine-chrome:latest
    entrypoint: ["/bin/sh"]
    command: ["-c", "while true; do sleep 3600; done"]
    volumes:
      - ./chrome-headless-data:/data
    shm_size: "1gb"
    # Host networking — per-bypass debug ports bind on container's loopback,
    # daemon (also on host) reaches them via 127.0.0.1.
    network_mode: host
    restart: unless-stopped
